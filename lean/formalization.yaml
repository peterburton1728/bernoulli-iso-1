version: v0.4
project:
  name: Finite uniform Bernoulli shifts with unequal base entropy
  description: >-
    There exist a countable group G and a nontrivial finite alphabet A such
    that the ordinary left Bernoulli shifts on A and A times A, equipped
    with their uniform product probability measures, are equivariantly
    measure-preservingly isomorphic on invariant conull measurable sets.
    The inverse is measurable. The finite alphabets have different
    cardinalities and therefore different uniform base Shannon entropies.
    The algebraic existence input is supplied by the pinned OpenAI proofs.
    This formalization does not certify all-base collapse, finitary
    continuity, the integer coding inputs, or the manuscript's later corollaries.
  authors: [Peter Burton]
  responsible_maintainers: [Peter Burton]
  license: Apache-2.0
sources:
  - title: Finitary collapse of Bernoulli shifts from an algebraic splitting
    authors: [Peter Burton]
    type: paper
    relationship: formalizes
    location: Finite-uniform measurable conjugacy theorem
    note: >-
      Accompanying GPT-6 written draft, dated 25 October 2026. This entry
      refers only to its finite-uniform measurable statement, not its
      stronger all-base or finitary statements. The note is intended to accompany the released Lean sources as
      the repository-root bernoulli-iso.pdf; its TeX source is retained at
      lean/provenance/exposition/bernoulli-iso.tex.
  - title: A Counterexample to Kaplansky's Direct-Finiteness Conjecture in Characteristic Two
    authors: [OpenAI]
    type: paper
    relationship: adapts
    id: https://github.com/openai/math/tree/adc7f1241b42e322a6451854ab7e4b4c146bf78a/preprints/A-Counterexample-to-Kaplanskys-Direct-Finiteness-Conjecture-in-Characteristic-Two-September-23-2026
    location: Subgroup averages and a rectangular identity; finite incidence prescription
    note: >-
      Supplies the algebraic existence input. Its proof development is
      imported with a recorded Lean probability-API port; its result is
      not credited to this project.
