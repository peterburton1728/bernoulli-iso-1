[[lean_lib]]
name = "CertifiedInput"
leanOptions = { autoImplicit = false }
moreLeanArgs = ["-j", "1", "-DElab.async=false"]

[[lean_lib]]
name = "Challenge"
moreLeanArgs = ["-j", "1", "-DElab.async=false"]

[[lean_lib]]
name = "Solution"
moreLeanArgs = ["-j", "1", "-DElab.async=false"]

[[lean_lib]]
name = "Audit"
moreLeanArgs = ["-j", "1", "-DElab.async=false"]
